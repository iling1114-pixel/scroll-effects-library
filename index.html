<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滾動效果圖鑑 Scroll Effects Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0e8;--card:#fbfaf6;--ink:#171614;--mute:#7a756b;--line:#dcd7ca;
  --acc:#ff4d2e;--blue:#2e5bff;--green:#16a37a;--yellow:#f2b705;--purple:#8b5cf6;
  --mono:'JetBrains Mono',ui-monospace,monospace;--disp:'Space Grotesk','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}

/* ---------- Hero ---------- */
.hero{max-width:1320px;margin:0 auto;padding:56px 28px 32px;display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:end}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--mute)}
.eyebrow b{color:var(--acc);font-weight:500}
h1{font:900 clamp(46px,7.2vw,100px)/.95 'Noto Sans TC',sans-serif;letter-spacing:-.03em;margin:14px 0 0}
h1 em{font-style:normal;color:var(--acc)}
h1 small{display:block;font:500 clamp(14px,1.4vw,18px)/1.2 var(--disp);letter-spacing:.02em;color:var(--mute);margin-top:14px}
.lead{font-size:15px;line-height:1.85;color:#3d3a34;margin:0 0 22px;max-width:46ch}
.stats{display:flex;gap:32px;border-top:1px solid var(--line);padding-top:18px}
.stats b{display:block;font:700 34px/1 var(--disp)}
.stats span{font-size:12px;color:var(--mute)}

/* ---------- Toolbar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(243,240,232,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:12px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{position:relative}
.search input{width:250px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px 9px 34px;font:inherit;font-size:13px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;padding:7px 12px;border-radius:99px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip:hover{border-color:var(--ink)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink))}
.chip small{font:500 11px var(--mono);opacity:.55}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on i{box-shadow:0 0 0 2px var(--ink),0 0 0 3px var(--bg)}
.tools{margin-left:auto;display:flex;align-items:center;gap:14px}
.count{font:500 11px var(--mono);color:var(--mute)}
.tog{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font-size:13px;padding:4px 0}
.tog span{width:32px;height:18px;border-radius:99px;background:#cfc9bb;position:relative;transition:.25s}
.tog span::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.25s}
.tog[aria-pressed="true"] span{background:var(--acc)}
.tog[aria-pressed="true"] span::after{left:16px}

/* ---------- Grid & card ---------- */
main{max-width:1320px;margin:0 auto;padding:28px 28px 64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px -18px rgba(23,22,20,.35)}
.card[hidden]{display:none}
.pv{position:relative}
.vp{height:260px;overflow-y:auto;overflow-x:hidden;position:relative;background:#ebe7dc;border-radius:11px;scrollbar-width:thin;scrollbar-color:#bdb7a8 transparent;color:var(--ink)}
@media (hover:hover){.vp{overscroll-behavior:contain}}
.hint{position:absolute;right:10px;bottom:10px;font:500 10px/1 var(--mono);background:rgba(23,22,20,.8);color:#fff;padding:6px 9px;border-radius:99px;pointer-events:none;transition:opacity .4s;z-index:5}
.pv.touched .hint{opacity:0}
.pv.paused .hint{opacity:1}
.meta{padding:14px 8px 6px;display:flex;flex-direction:column;gap:5px;flex:1}
.row1{display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono);color:var(--mute)}
.cat{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:12px}
.cat::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}
.meta h3{margin:4px 0 0;font:800 22px/1.25 'Noto Sans TC',sans-serif;cursor:pointer}
.en{margin:0;font:500 13px var(--disp);color:var(--mute)}
.desc{margin:6px 0 0;font-size:14px;line-height:1.7;color:#3d3a34}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.tags span{font:500 10.5px var(--mono);border:1px solid var(--line);padding:4px 8px;border-radius:6px;color:#55514a}
.more{margin-top:12px;align-self:flex-start;background:none;border:0;padding:0 0 2px;font:700 13px 'Noto Sans TC',sans-serif;cursor:pointer;border-bottom:1.5px solid var(--acc)}
.more:hover{color:var(--acc)}
.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--mute)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(23,22,20,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px}
.modal[hidden]{display:none}
.mbox{background:var(--bg);border-radius:22px;width:min(1120px,100%);max-height:calc(100vh - 48px);overflow:auto;position:relative;padding:24px}
.x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;z-index:3}
.mgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.pv.big .vp{height:min(460px,56vh)}
.minfo{padding-top:4px}
.minfo .row1{padding-right:52px}
.minfo h2{font:900 34px/1.15 'Noto Sans TC',sans-serif;margin:8px 0 2px}
.minfo dl{margin:18px 0 0}
.minfo dt{font:500 11px var(--mono);letter-spacing:.1em;color:var(--mute);margin-top:14px}
.minfo dd{margin:4px 0 0;font-size:14.5px;line-height:1.75}
.mnav{display:flex;gap:8px;margin-top:22px}
.mnav button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer}
.mnav button:hover{border-color:var(--ink)}
.mcode{margin-top:24px;background:#1b1a17;border-radius:14px;overflow:hidden}
.mcode-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#bdb7a8;font:500 11px var(--mono);border-bottom:1px solid #2c2a26}
.copy{background:var(--acc);color:#fff;border:0;border-radius:99px;padding:7px 14px;font:700 12px 'Noto Sans TC',sans-serif;cursor:pointer}
pre{margin:0;padding:20px 22px;overflow:auto;font:14px/1.85 'Noto Sans TC',sans-serif;color:#efe9da;white-space:pre-wrap;max-height:460px}
pre code{font:inherit}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:24px;padding:36px 18px 24px}
  .bar-in{padding:10px 18px}
  .search,.search input{width:100%}
  .tools{margin-left:0;width:100%;justify-content:space-between}
  main{padding:18px}
  .modal{padding:0}
  .mbox{border-radius:0;max-height:100vh;height:100vh;padding:18px}
  .mgrid{grid-template-columns:1fr;gap:16px}
  .minfo h2{font-size:26px}
}

/* =========================================================
   Preview internals
   ========================================================= */
.pad{height:calc(var(--h)*.45);display:grid;place-items:center;font:500 11px/1 var(--mono);letter-spacing:.1em;color:#9a958a}
.stage{position:sticky;top:0;height:var(--h);overflow:hidden}
.ln-p{padding:0 14px 12px}
.ln-p i{display:block;height:7px;border-radius:4px;background:#d3cdbf;margin-bottom:8px}

/* se-01 */
.fu-item{margin:10px 14px;padding:12px;background:#fff;border-radius:11px;display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(28px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
.fu-item.in{opacity:1;transform:none}
.fu-item i{width:34px;height:34px;border-radius:9px;flex:none}
.fu-txt{flex:1}
.fu-txt b{display:block;height:9px;width:62%;background:var(--ink);border-radius:4px;margin-bottom:7px}
.fu-txt span{display:block;height:7px;width:40%;background:#d6d1c4;border-radius:4px}
/* se-02 */
.sg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.sg-tile{aspect-ratio:1;opacity:0;transform:scale(.55) translateY(16px);transition:opacity .45s,transform .6s cubic-bezier(.3,1.5,.5,1);transition-delay:calc(var(--i)*60ms)}
.sg-grid.in .sg-tile{opacity:1;transform:none}
/* se-03 */
.ct-wrap{display:grid;gap:10px;padding:0 14px}
.ct-box{background:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:baseline;gap:4px;border-left:5px solid}
.ct-num{font:700 34px/1 var(--disp);font-variant-numeric:tabular-nums}
.ct-suf{font:700 18px var(--disp)}
.ct-lab{font-size:12px;color:var(--mute);margin-left:auto}
/* se-04 */
.rl-list{perspective:700px;padding:calc(var(--h)*.42) 18px}
.rl-row{height:46px;margin-bottom:8px;border-radius:11px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;will-change:transform,opacity}
.rl-row em{font:500 12px var(--mono);font-style:normal;color:var(--mute)}
.rl-row span{height:8px;flex:1;background:#d6d1c4;border-radius:4px}
.rl-row b{width:16px;height:16px;border-radius:50%;flex:none}
/* se-05 */
.px-stage{background:linear-gradient(#ffe3c4,#ffb48a 55%,#ff8a5c)}
.px-sun{position:absolute;left:50%;top:12%;width:66px;height:66px;margin-left:-33px;border-radius:50%;background:#fff5dc;box-shadow:0 0 50px 10px rgba(255,245,220,.8)}
.px-far,.px-near{position:absolute;left:0;right:0;will-change:transform}
.px-far{bottom:-25%;height:70%}
.px-near{bottom:-55%;height:90%}
.px-far svg,.px-near svg{width:100%;height:100%;display:block}
.px-title{position:absolute;left:0;right:0;top:30%;text-align:center;font:700 34px var(--disp);color:#fff;letter-spacing:.06em;text-shadow:0 2px 12px rgba(120,40,40,.25)}
/* se-06 */
.iz-stage{display:grid;place-items:center}
.iz-img{width:100%;height:100%;background:radial-gradient(circle at 28% 34%,#f2b705 0 13%,transparent 13.5%),radial-gradient(circle at 74% 68%,#ff4d2e 0 21%,transparent 21.5%),linear-gradient(135deg,#2e5bff,#171614);display:flex;align-items:flex-end;padding:18px;color:#fff;font:700 24px var(--disp);will-change:transform}
/* se-07 */
.sk-card{position:sticky;margin:0 14px calc(var(--h)*.28);height:calc(var(--h)*.62);border-radius:15px;padding:16px;transform-origin:top center;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 -8px 22px rgba(0,0,0,.1)}
.sk-card span{font:500 10px var(--mono);letter-spacing:.12em;opacity:.85}
.sk-card b{font:900 30px 'Noto Sans TC',sans-serif}
/* se-08 */
.hz-track{display:flex;gap:12px;height:100%;align-items:center;padding:0 14px;will-change:transform}
.hz-panel{flex:none;width:72%;height:70%;border-radius:15px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.hz-panel span{font:500 10px var(--mono);letter-spacing:.12em}
.hz-panel b{font:700 36px var(--disp)}
.hz-bar{position:absolute;left:14px;right:14px;bottom:14px;height:3px;background:#d6d1c4;border-radius:2px;overflow:hidden}
.hz-bar i{display:block;height:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
/* se-09 */
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.st-vis{position:sticky;top:calc(var(--h)*.15);height:calc(var(--h)*.7);align-self:start;background:#fff;border-radius:15px;display:grid;place-items:center;overflow:hidden}
.st-num{position:absolute;top:10px;left:12px;font:500 11px var(--mono);color:var(--mute)}
.st-shape{width:74px;height:74px;transition:all .6s cubic-bezier(.5,0,.2,1)}
.st-step{min-height:calc(var(--h)*.8);display:flex;align-items:center}
.st-step p{margin:0;font-size:13px;line-height:1.55;opacity:.25;transition:opacity .35s}
.st-step p b{display:block;font:700 14px 'Noto Sans TC',sans-serif;margin-bottom:2px}
.st-step.on p{opacity:1}
/* se-10 */
.vp.snap{scroll-snap-type:y mandatory}
.sn-dots{position:sticky;top:0;height:0;z-index:2}
.sn-dots div{position:absolute;right:12px;top:calc(var(--h)/2);transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.sn-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:.3s;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.sn-dots i.on{height:20px;background:#fff}
.sn-page{height:var(--h);scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;text-align:center}
.sn-page b{display:block;font:700 62px/1 var(--disp)}
.sn-page span{font-size:13px;letter-spacing:.3em}
/* se-11 */
.cr-base,.cr-top{position:absolute;inset:0;display:grid;place-items:center;font:700 42px var(--disp);letter-spacing:.02em}
.cr-base{background:var(--ink);color:#f3f0e8}
.cr-top{background:var(--acc);color:var(--ink);clip-path:circle(0% at 50% 50%)}
/* se-12 */
.dr-in{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;background:var(--yellow);text-align:center}
.dr-in b{font:900 32px 'Noto Sans TC',sans-serif}
.dr-in span{font:500 11px var(--mono);letter-spacing:.24em}
.dr-l,.dr-r{position:absolute;top:0;bottom:0;width:50%;background:var(--ink) repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.05) 10px 20px);display:flex;align-items:center;color:#f3f0e8;font:700 40px var(--disp);will-change:transform}
.dr-l{left:0;justify-content:flex-end;padding-right:4px;border-right:1px solid #3a3833}
.dr-r{right:0;padding-left:4px}
/* se-13 */
.vp.bgs{transition:background-color .7s,color .7s}
.bs-sec{height:calc(var(--h)*.9);display:grid;place-items:center;align-content:center;text-align:center;gap:6px}
.bs-sec b{font:900 30px 'Noto Sans TC',sans-serif}
.bs-sec span{font:500 11px var(--mono);letter-spacing:.2em;opacity:.7}
/* se-14 */
.th-stage{display:flex;align-items:center;padding:0 22px}
.th-text{font:700 21px/1.65 'Noto Sans TC',sans-serif;margin:0}
.th-text span{color:#cbc5b6;transition:color .15s}
.th-text span.lit{color:var(--ink)}
.th-text span.lit[data-k]{color:var(--acc)}
/* se-15 */
.mq-stage{display:flex;flex-direction:column;justify-content:center;gap:4px;background:var(--ink)}
.mq-row{overflow:hidden;white-space:nowrap}
.mq-track{display:inline-flex;will-change:transform;font:700 40px/1.15 var(--disp);color:#f3f0e8}
.mq-track span{padding-right:22px}
.mq-row.o .mq-track{color:transparent;-webkit-text-stroke:1.2px #f3f0e8}
.mq-row.a .mq-track{color:var(--acc)}
/* se-16 */
.op-stage{display:flex;flex-direction:column;justify-content:center;gap:2px}
.op-line{white-space:nowrap;font:700 54px/1.05 var(--disp);letter-spacing:-.02em;will-change:transform}
.op-line.b{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.op-line.c{color:var(--acc);font-family:'Noto Sans TC',sans-serif;font-weight:900}
/* se-17 */
.ld-stage{display:grid;place-items:center}
.ld-svg{width:92%;height:80%;overflow:visible}
.ld-bg{fill:none;stroke:#cfc9bb;stroke-width:2;stroke-dasharray:4 6}
.ld-path{fill:none;stroke:var(--acc);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.ld-dot{fill:var(--ink)}
.ld-pct{position:absolute;top:12px;left:14px;font:500 11px var(--mono);color:var(--mute)}
/* se-18 */
.pg-head{position:sticky;top:0;background:rgba(251,250,246,.94);z-index:2}
.pg-row{display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--mute);padding:11px 14px 9px;letter-spacing:.06em}
.pg-bar{height:4px;background:var(--acc);transform-origin:0 50%;transform:scaleX(0)}
.pg-art{padding-top:16px}
.pg-h{height:16px;width:70%;background:var(--ink);border-radius:4px;margin:0 14px 16px}
.pg-img{height:96px;margin:4px 14px 16px;border-radius:11px;background:linear-gradient(135deg,#2e5bff,#16a37a)}
/* se-19 */
.sh-head{position:sticky;top:0;z-index:2;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;transition:height .3s,background-color .3s,box-shadow .3s}
.sh-head.s{height:42px;background:rgba(255,255,255,.94);box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 18px rgba(0,0,0,.07)}
.sh-logo{font:700 19px var(--disp);transition:font-size .3s}
.sh-head.s .sh-logo{font-size:14px}
.sh-nav{display:flex;gap:8px;align-items:center}
.sh-nav i{width:24px;height:6px;border-radius:3px;background:var(--ink);opacity:.4}
.sh-nav b{font-size:10px;background:var(--acc);color:#fff;padding:5px 9px;border-radius:99px}
.sh-hero{margin:0 14px 16px;height:150px;border-radius:14px;background:linear-gradient(135deg,#16a37a,#2e5bff);display:flex;align-items:flex-end;padding:14px;color:#fff;font:700 22px var(--disp)}
/* se-20 */
.hd-head{position:sticky;top:0;z-index:2;height:46px;background:var(--ink);color:#f3f0e8;display:flex;align-items:center;justify-content:space-between;padding:0 14px;transition:transform .35s cubic-bezier(.4,0,.2,1);font:700 14px var(--disp)}
.hd-head span:last-child{font:500 10px var(--mono);opacity:.7}
.hd-head.h{transform:translateY(-100%)}
.hd-gap{height:14px}
/* se-21 */
.bf-img{height:130px;margin:0 14px 12px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font:500 10px var(--mono);letter-spacing:.12em;will-change:filter,transform}
/* se-22 */
.cs-line{overflow:hidden;padding:4px 18px;margin-bottom:calc(var(--h)*.16);font:900 34px/1.15 var(--disp),'Noto Sans TC',sans-serif;white-space:nowrap}
.cs-line span{display:inline-block;transform:translateY(110%) rotate(10deg);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;transition-delay:calc(var(--i)*40ms)}
.cs-line.in span{transform:none;opacity:1}
/* se-23 */
.us-stage{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 20px;background:var(--ink);color:#f3f0e8}
.us-a{font:500 22px/1.2 var(--mono);white-space:pre}
.us-b{font:900 30px/1.2 'Noto Sans TC',sans-serif;color:var(--acc)}
.us-stage .x{color:#6f6a60}
.us-p{position:absolute;top:12px;left:20px;font:500 10px var(--mono);letter-spacing:.1em;color:#8f897d}
/* se-24 */
.fl-list{padding:calc(var(--h)*.4) 14px;overflow:hidden}
.fl-row{height:48px;margin-bottom:8px;background:#fff;border-radius:11px;display:flex;align-items:center;gap:12px;padding:0 12px;will-change:transform,opacity}
.fl-row b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px var(--disp);flex:none}
.fl-row strong{display:block;font:700 13px var(--disp)}
.fl-row span{display:block;width:90px;height:6px;border-radius:3px;background:#d6d1c4;margin-top:5px}
/* se-25 */
.cf-card{height:140px;margin:0 30px calc(var(--h)*.2);perspective:800px}
.cf-in{position:relative;height:100%;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.cf-card.in .cf-in{transform:none}
.cf-f,.cf-b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.cf-f{color:#fff;text-align:center}

      for (let k = 0; k < N; k++) {
        const t = k / N * Math.PI * 2 - Math.PI / 2, r = S[i](t) * (1 - f) + S[i + 1](t) * f;
        d += (k ? 'L' : 'M') + (r * Math.cos(t)).toFixed(2) + ' ' + (r * Math.sin(t)).toFixed(2);
      }
      path.setAttribute('d', d + 'Z');
      const a = hex(COL[i]), b = hex(COL[i + 1]);
      path.style.fill = `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(',')})`;
      path.setAttribute('transform', `rotate(${p * 90})`);
      lab.textContent = NAMES[Math.round(seg)];
    };
  },
  'se-34': (vp) => {
    const T = ['簡介', '安裝', '使用方式', '常見問題', '授權'];
    vp.innerHTML = `<div class="sp-grid"><nav class="sp-toc">${T.map((t) => `<a>${t}</a>`).join('')}</nav><div class="sp-body">${T.map((t) => `<section class="sp-sec"><h5>${t}</h5>${LINES(2)}</section>`).join('')}<div style="height:calc(var(--h)*.6)"></div></div></div>`;
    const links = $$('.sp-toc a', vp), secs = $$('.sp-sec', vp);
    links.forEach((a, i) => a.addEventListener('click', (e) => { e.stopPropagation(); vp.scrollTo({ top: vp.scrollTop + rt(secs[i], vp) - 10, behavior: 'smooth' }); }));
    return () => {
      const H = vp.clientHeight; let cur = 0;
      secs.forEach((s, i) => { if (rt(s, vp) <= H * .3) cur = i; });
      links.forEach((a, i) => a.classList.toggle('on', i === cur));
    };
  },
  'se-35': (vp) => {
    const G = [['A', 'Amber', 'Alan', 'Avery'], ['B', 'Brian', 'Bella', 'Bruce'], ['C', 'Chloe', 'Carter', 'Cindy'], ['D', 'Daniel', 'Diana', 'Dylan'], ['E', 'Emma', 'Ethan', 'Eva'], ['F', 'Felix', 'Fiona', 'Frank']];
    vp.innerHTML = `<div class="ai-idx"><div>${G.map((g) => `<i>${g[0]}</i>`).join('')}</div></div>` + G.map((g) =>
      `<div class="ai-grp"><h6>${g[0]}</h6>${g.slice(1).map((n) => `<div class="ai-row"><b>${n[0]}</b>${n}</div>`).join('')}</div>`).join('') + `<div style="height:calc(var(--h)*.5)"></div>`;
    const grps = $$('.ai-grp', vp), ls = $$('.ai-idx i', vp);
    ls.forEach((l, i) => l.addEventListener('click', (e) => { e.stopPropagation(); vp.scrollTo({ top: vp.scrollTop + rt(grps[i], vp), behavior: 'smooth' }); }));
    return () => {
      let cur = 0; grps.forEach((g, i) => { if (rt(g, vp) <= 2) cur = i; });
      ls.forEach((l, i) => { const d = Math.abs(i - cur); l.classList.toggle('on', d === 0); l.style.transform = `scale(${d === 0 ? 1.6 : d === 1 ? 1.25 : 1})`; });
    };
  },
  'se-36': (vp) => {
    vp.innerHTML = `<div class="sw-head">訂單紀錄<span>14 筆</span></div><div class="sw-st"></div>${Array.from({ length: 14 }, (_, i) =>
      `<div class="sw-row"><span>#20${String(i + 31).padStart(2, '0')}</span><i style="max-width:${40 + (i * 17) % 45}%"></i><b>NT$ ${(1200 + i * 370).toLocaleString()}</b></div>`).join('')}<div class="sw-sb"></div>`;
    const st = $('.sw-st', vp), sb = $('.sw-sb', vp);
    return () => {
      const y = vp.scrollTop, max = vp.scrollHeight - vp.clientHeight;
      st.style.setProperty('--o', y > 4 ? 1 : 0); sb.style.setProperty('--o', y < max - 4 ? 1 : 0);
    };
  },
  'se-37': (vp) => {
    vp.innerHTML = `<div class="pg-h" style="margin-top:16px"></div>${LINES(9)}<div class="bt-wrap"><button class="bt-btn" aria-label="回到頂部"><svg viewBox="0 0 44 44"><circle class="bt-bg" cx="22" cy="22" r="19"/><circle class="bt-ring" cx="22" cy="22" r="19" pathLength="1"/></svg><span>↑</span></button></div>`;
    const btn = $('.bt-btn', vp), ring = $('.bt-ring', vp);
    btn.addEventListener('click', (e) => { e.stopPropagation(); vp.scrollTo({ top: 0, behavior: 'smooth' }); });
    return () => {
      const p = clamp(vp.scrollTop / (vp.scrollHeight - vp.clientHeight));
      ring.style.strokeDashoffset = 1 - p; btn.classList.toggle('show', vp.scrollTop > 40);
    };
  },
  'se-38': (vp) => {
    vp.innerHTML = `<div class="ss-tag">SMOOTH SCROLL · 用滑鼠滾輪試試</div>${Array.from({ length: 14 }, (_, i) =>
      `<div class="ss-row"><em style="color:${C[i % 5]}">${String(i + 1).padStart(2, '0')}</em><span style="max-width:${50 + (i * 23) % 45}%"></span></div>`).join('')}`;
    if (!NOHOVER) {
      let target = 0, cur = 0, anim = false;
      const step = () => {
        cur += (target - cur) * .09;
        if (Math.abs(target - cur) < .5) { cur = target; anim = false; }
        vp.scrollTop = cur; vp._pos = cur;
        if (anim) requestAnimationFrame(step);
      };
      vp.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (!anim) cur = target = vp.scrollTop;
        target = clamp(target + e.deltaY, 0, vp.scrollHeight - vp.clientHeight);
        if (!anim) { anim = true; requestAnimationFrame(step); }
      }, { passive: false });
    }
    return () => {};
  },
};

/* ---------- mounting & auto demo ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NOHOVER = matchMedia('(hover: none)').matches; // 手機、平板等沒有滑鼠的裝置
let AUTO = !RM, modalOpen = false;
const live = new Set();
const visIO = new IntersectionObserver((es) => es.forEach((e) => { const vp = e.target.querySelector('.vp'); if (vp) vp._vis = e.isIntersecting; }));

function mount(vp, id, isModal) {
  if (vp.clientHeight) vp.style.setProperty('--h', vp.clientHeight + 'px');
  const r = B[id](vp);
  const o = typeof r === 'function' ? { update: r } : r;
  Object.assign(vp, { _u: o.update || (() => {}), _t: o.tick, _pos: 0, _dir: 1, _pause: 0, _user: 0, _next: 0, _modal: !!isModal, _vis: !!isModal });
  vp.addEventListener('scroll', () => {
    if (Math.abs(vp.scrollTop - vp._pos) > 3) vp._pos = vp.scrollTop;
    if (!vp._q) { vp._q = 1; requestAnimationFrame(() => { vp._q = 0; vp._u(); }); }
  }, { passive: true });
  const mark = () => { vp._user = performance.now() + 3500; vp.parentNode.classList.add('touched'); };
  ['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach((ev) => vp.addEventListener(ev, mark, { passive: true }));
  if (NOHOVER) {
    // 觸控裝置：點一下暫停／繼續（手指滑動不會觸發 click）
    vp.addEventListener('click', () => {
      vp._paused = !vp._paused;
      Object.assign(vp, { _user: 0, _pos: vp.scrollTop, _pause: 0, _next: 0 });
      setPaused(vp);
    });
  } else {
    vp.addEventListener('mouseenter', () => { vp._hover = 1; });
    vp.addEventListener('mouseleave', () => { vp._hover = 0; vp._pos = vp.scrollTop; });
    const host = vp.closest('.card') || vp.parentNode;
    host.addEventListener('mouseenter', () => { vp._cardHover = 1; vp._pos = vp.scrollTop; vp._pause = 0; vp._next = 0; });
    host.addEventListener('mouseleave', () => { vp._cardHover = 0; });
  }
  vp.tabIndex = 0;
  live.add(vp);
  vp._u();
}

function setPaused(vp) {
  vp.parentNode.classList.toggle('paused', !!vp._paused);
  syncHints();
}

// 觸控裝置：找出最接近畫面中央的預覽
let prevCenter = null;
function findCenter() {
  if (modalOpen) { for (const vp of live) if (vp._modal && vp.isConnected) return vp; return null; }
  const mid = innerHeight / 2; let best = null, bd = innerHeight * .35;
  for (const vp of live) {
    if (!vp._vis || vp._modal || !vp.isConnected) continue;
    const r = vp.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid);
    if (d < bd) { bd = d; best = vp; }
  }
  return best;
}

let lastT = performance.now();
function loop(t) {
  const dt = Math.min(50, t - lastT); lastT = t;
  let center = null;
  if (NOHOVER) {
    center = findCenter();
    if (center !== prevCenter) {
      // 離開中央的卡片解除暫停，下次滑回來會重新播放
      if (prevCenter && prevCenter._paused) { prevCenter._paused = 0; setPaused(prevCenter); }
      if (center) center._pos = center.scrollTop;
      prevCenter = center;
    }
  }
  for (const vp of live) {
    if (!vp.isConnected) { live.delete(vp); continue; }
    if (!vp._vis || (modalOpen && !vp._modal)) continue;
    const active = NOHOVER ? vp === center : vp._cardHover;
    const run = !vp._paused && t > vp._user && (AUTO ? !vp._hover : active);
    if (run) {
      const H = vp.clientHeight, max = vp.scrollHeight - H;
      if (vp._snap) {
        if (t > vp._next) {
          let ny = vp.scrollTop + H * vp._dir;
          if (ny > max + 2 || ny < -2) { vp._dir *= -1; ny = vp.scrollTop + H * vp._dir; }
          vp.scrollTo({ top: ny, behavior: 'smooth' });
          vp._next = t + 1800;
        }
      } else if (t > vp._pause) {
        vp._pos += .085 * dt * vp._dir;
        if (vp._pos >= max) { vp._pos = max; vp._dir = -1; vp._pause = t + 1100; }
        else if (vp._pos <= 0) { vp._pos = 0; vp._dir = 1; vp._pause = t + 1100; }
        vp.scrollTop = vp._pos;
      }
    }
    if (vp._t && !RM) vp._t();
  }
  requestAnimationFrame(loop);
}

/* ---------- render cards ---------- */
const grid = $('#grid');
grid.innerHTML = DATA.map((d) => `
  <article class="card" data-id="${d.id}">
    <div class="pv"><div class="vp" aria-label="${d.zh} 預覽，可在框內滾動"></div><span class="hint">↕ 框內可滾動</span></div>
    <div class="meta">
      <div class="row1"><span>${d.id.toUpperCase()}</span><span class="cat" style="--c:${catColor(d.cat)}">${d.cat}</span></div>
      <h3 data-open="${d.id}">${d.zh}</h3>
      <p class="en">${d.en}</p>
      <p class="desc">${d.desc}</p>
      <div class="tags"><span>${d.lv}</span><span>${d.tech}</span></div>
      <button class="more" data-open="${d.id}">看說明與提示詞 →</button>
    </div>
  </article>`).join('') + '<p class="empty" hidden id="empty">找不到符合的效果，換個關鍵字試試。</p>';

$$('.card', grid).forEach((card) => { mount($('.vp', card), card.dataset.id); visIO.observe($('.pv', card)); });

$$('.n-fx').forEach((el) => { el.textContent = DATA.length; });

/* ---------- filter ---------- */
let curCat = '全部', q = '';
const chips = $('#chips');
chips.innerHTML = [{ k: '全部', c: 'var(--ink)' }, ...CATS].map((c) =>
  `<button class="chip${c.k === '全部' ? ' on' : ''}" data-cat="${c.k}" style="--c:${c.c}">${c.k === '全部' ? '' : '<i></i>'}${c.k}<small>${c.k === '全部' ? DATA.length : DATA.filter((d) => d.cat === c.k).length}</small></button>`).join('');
chips.addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  curCat = b.dataset.cat; $$('.chip', chips).forEach((x) => x.classList.toggle('on', x === b)); apply();
});
$('#q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); apply(); });

function visibleList() {
  return DATA.filter((d) => (curCat === '全部' || d.cat === curCat) &&
    (!q || [d.id, d.zh, d.en, d.cat, d.desc, d.use, d.tech].join(' ').toLowerCase().includes(q)));
}
function apply() {
  const ids = new Set(visibleList().map((d) => d.id));
  $$('.card', grid).forEach((c) => { c.hidden = !ids.has(c.dataset.id); });
  $('#empty').hidden = ids.size > 0;
  $('#count').textContent = `顯示 ${ids.size} / ${DATA.length}`;
  requestAnimationFrame(() => live.forEach((vp) => { if (vp.clientHeight) { vp.style.setProperty('--h', vp.clientHeight + 'px'); vp._u(); } }));
}
apply();

/* ---------- auto toggle ---------- */
const autoBtn = $('#auto');
autoBtn.setAttribute('aria-pressed', String(AUTO));
autoBtn.addEventListener('click', () => {
  AUTO = !AUTO; autoBtn.setAttribute('aria-pressed', String(AUTO));
  live.forEach((vp) => { vp._pos = vp.scrollTop; });
  syncHints();
});
function syncHints() {
  const base = AUTO ? (NOHOVER ? '↕ 點一下暫停' : '↕ 框內可滾動') : (NOHOVER ? '▶ 滑到中間播放' : '▶ 滑過卡片播放');
  $$('.hint').forEach((h) => { h.textContent = h.parentNode.classList.contains('paused') ? '❚❚ 已暫停，點一下繼續' : base; });
}
syncHints();

/* ---------- modal ---------- */
const modal = $('#modal');
let curId = null;
function openModal(id) {
  const d = DATA.find((x) => x.id === id); if (!d) return;
  curId = id; modalOpen = true;
  modal.hidden = false; document.body.style.overflow = 'hidden';
  $('#m-id').textContent = d.id.toUpperCase();
  const mc = $('#m-cat'); mc.textContent = d.cat; mc.style.setProperty('--c', catColor(d.cat));
  $('#m-title').textContent = d.zh; $('#m-en').textContent = d.en;
  $('#m-desc').textContent = d.desc; $('#m-use').textContent = d.use;
  $('#m-tech').textContent = `${d.how}（${d.lv} · ${d.tech}）`; $('#m-tip').textContent = d.tip;
  $('#m-code').textContent = promptOf(d);
  const pv = $('#m-pv'); pv.className = 'pv big'; pv.innerHTML = '<div class="vp"></div><span class="hint">↕ 框內可滾動</span>';
  mount($('.vp', pv), id, true);
  syncHints();
  $('.mbox').scrollTop = 0;
  if (location.hash !== '#' + id) location.hash = id;
}
function closeModal(fromRoute) {
  if (!modalOpen) return;
  modalOpen = false; curId = null; modal.hidden = true; document.body.style.overflow = '';
  $('#m-pv').innerHTML = '';
  if (!fromRoute && location.hash) location.hash = '';
}
function step(n) {
  const list = visibleList(); const pool = list.length ? list : DATA;
  let i = pool.findIndex((d) => d.id === curId); i = (i + n + pool.length) % pool.length;
  openModal(pool[i].id);
}
grid.addEventListener('click', (e) => { const t = e.target.closest('[data-open]'); if (t) openModal(t.dataset.open); });
$('#m-close').addEventListener('click', () => closeModal());
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
$('#m-prev').addEventListener('click', () => step(-1));
$('#m-next').addEventListener('click', () => step(1));
addEventListener('keydown', (e) => {
  if (!modalOpen) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight' && !e.target.closest('.vp')) step(1);
  if (e.key === 'ArrowLeft' && !e.target.closest('.vp')) step(-1);
});
$('#m-copy').addEventListener('click', async (e) => {
  const btn = e.currentTarget, code = $('#m-code');
  try { await navigator.clipboard.writeText(code.textContent); btn.textContent = '已複製 ✓'; }
  catch (err) {
    const r = document.createRange(); r.selectNodeContents(code);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    btn.textContent = '已選取，請按 Ctrl / ⌘ + C';
  }
  setTimeout(() => { btn.textContent = '複製提示詞'; }, 2000);
});

function route() {
  const m = location.hash.match(/^#(se-\d\d)$/);
  if (m && B[m[1]]) { if (curId !== m[1]) openModal(m[1]); } else closeModal(true);
}
addEventListener('hashchange', route);
route();

addEventListener('resize', () => live.forEach((vp) => { if (vp.clientHeight) { vp.style.setProperty('--h', vp.clientHeight + 'px'); vp._u(); } }));
requestAnimationFrame(loop);
})();
</script>
